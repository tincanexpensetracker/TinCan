<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get TINCAN on Google Play</title>

<!-- No-JS fallback: still lands on the Play web listing. -->
<noscript><meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=tincan.ai"></noscript>

<link rel="canonical" href="https://play.google.com/store/apps/details?id=tincan.ai">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0e0e12; color: #f2f2f7; text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: light) { body { background: #f7f7fb; color: #16161a; } }
  .wrap { max-width: 26rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  p  { opacity: .75; margin: 0 0 1.5rem; line-height: 1.5; }
  a.btn {
    display: inline-block; padding: .85rem 1.5rem; border-radius: 999px;
    background: #7c4dff; color: #fff; font-weight: 700; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Opening Google Play…</h1>
    <p>If nothing happens, tap the button below.</p>
    <a class="btn" id="fallback" href="https://play.google.com/store/apps/details?id=tincan.ai">Get it on Google Play</a>
  </div>

<script>
(function () {
  var PKG  = "tincan.ai";
  var WEB  = "https://play.google.com/store/apps/details?id=" + PKG;
  var isAndroid = /android/i.test(navigator.userAgent);

  if (isAndroid) {
    // Android intent URL: asks the SYSTEM to hand off to the Play Store app, which is what
    // breaks out of an in-app browser (Instagram/Facebook webviews) instead of rendering the
    // Play web page inside it. S.browser_fallback_url covers webviews that reject the intent.
    window.location.replace(
      "intent://details?id=" + PKG +
      "#Intent;scheme=market;package=com.android.vending;" +
      "S.browser_fallback_url=" + encodeURIComponent(WEB) + ";end"
    );
    // Belt-and-braces: if the intent was swallowed, fall back to the web listing.
    setTimeout(function () { window.location.replace(WEB); }, 1200);
  } else {
    window.location.replace(WEB);
  }
})();
</script>
</body>
</html>
